[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"

[project]
name="pydsh"
version="0.1.0.dev2"
description="Deepseek Harness 中文学习版（非官方包）"
readme="README.md"
requires-python=">=3.14"
license="MIT"
dependencies=[
    "pywebbridge>=0.1.1",

    "pyyaml>=6",
    "Pillow",
    "psutil",
    "watchfiles",
    "zstandard",
    "requests",
    "domonic",
    "nicegui",
]

[project.scripts]
pydsh="pydsh.__main__:main"

[tool.setuptools]
include-package-data=true

[tool.setuptools.package-dir]
pydsh="."